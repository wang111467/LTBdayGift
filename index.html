<!doctype html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <link rel="stylesheet" type="text/css" href="css/styles.css?v=4">
    <link rel="stylesheet" href="css/mobile.css?v=3">
<style>
    .iframepage {
        -webkit-overflow-scrolling: touch;
        overflow-x: scroll;
        overflow-y: hidden;
    }

    ::-webkit-scrollbar {
        width: 0px;
    }

    /*局部滚动的dom节点*/
    .scroll-el {
        overflow: auto;
    }
    #rotate-prompt { display: none; }
    @media (max-width: 960px) and (orientation: portrait) {
        body.entered:not(.portrait-allowed) #rotate-prompt {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 24px;
            background: #ee9ca7;
            color: #5a2434;
            font-family: "Microsoft YaHei", sans-serif;
            text-align: center;
        }
        #rotate-prompt p { margin: 8px 0; font-size: 22px; }
        #rotate-prompt button {
            margin-top: 24px;
            padding: 10px 20px;
            border: 2px solid #fff;
            border-radius: 24px;
            background: transparent;
            color: #5a2434;
            font-size: 17px;
        }
    }
</style>
</head>
<body>

    <iframe src="./html/login.html" id="iframepage" scrolling="auto" onload="changeFrameHeight()" frameborder="0"
        allow="fullscreen" allowfullscreen style="width:100%;height:100vh;display:block" marginwidth="0" marginheight="0"></iframe>
    <div id="rotate-prompt" role="status">
        <p>把手机横过来</p>
        <p>如画面未旋转，请开启手机自动旋转</p>
        <button type="button" id="continue-portrait">竖屏继续</button>
    </div>
    <script src="js/jquery-2.1.1.min.js" type="text/javascript"></script>
    <script src="js/jquery-1.8.4.min.js?v=5" type="text/javascript"></script>
    <script>
      document.getElementById('continue-portrait').addEventListener('click', function () {
        document.body.classList.add('portrait-allowed');
      });
    </script>
